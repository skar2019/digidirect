<div class="banner-video" data-role="banner-video" data-testid="bannerRotator-banner-video">
    <!-- ko foreach: {data: $parent.video, as: 'item'} -->
    <video class="video" preload="metadata" playsinline
           data-bind="
           afterRender: $parents[2].renderVideo($element, item),
           attr: {
               'poster': item.use_video_as_a_preview == '0' ? item.preview_image : false,
               'controls': item.allow_video_popup == '0' ? 'controls' : false,
               'loop': item.play_video_in_a_loop == '0' ? false : 'loop',
               'data-video-popup': item.allow_video_popup == '0' ? 'false' : 'true',
               'data-autoplay': item.play_video_automatically_for_mobile == '0' ? 'false' : 'true',
               'data-autoplay-large': item.play_video_automatically_for_desktop == '0' ? 'false' : 'true',
               'data-autoplay-delay': item.play_video_after,
               'data-video-id': 'video-' + item.banner_id + '-' + item.video_id,
               'data-modal-active': 'false',
               'data-modal-loaded': 'false'
           }">
        <source data-bind="attr: {'src': item.video}" type="video/mp4">
    </video>

    <!-- ko if: item.allow_video_popup == '1' -->
    <button class="play-button"
            data-bind="html: $t('Play'), attr: {'title': $t('Play')}, click: function() { $parents[2].playVideo($element) }"></button>
    <!-- /ko -->
    <!-- /ko -->
</div>
<div class="content -image" data-testid="bannerRotator-banner-content" data-bind="html: $parent.html, afterRender: $parents[1].contentRendered($parent)"></div>
