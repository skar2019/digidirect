        <img class="image" data-bind="attr: {src: image, alt: name}"/>
    <!-- /ko -->
    <!-- ko ifnot: $data.image -->
        <!-- ko if: $parents[2].locations.settings().default_image -->
            <img class="image" data-bind="attr: {src: $parents[2].locations.settings().default_image, alt: name}"/>
        <!-- /ko -->
    <!-- /ko -->
    <div class="details">
        <span class="name"><!-- ko text: name --><!-- /ko --></span>
        <address class="address">
