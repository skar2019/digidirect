<picture class="picture" data-testid="bannerRotator-banner-image">
    <!-- ko foreach: {data: $parent.images, as: 'image'} -->
    <source data-bind="attr: {'media': image.media ? image.media : '', 'srcset': image.src_set_image,
    'size': image.src_set_value ? image.src_set_value : '100vw' } "/>
    <!-- /ko -->
    <img data-bind="attr: {'src': $parent.images[$parent.images.length - 1].src_set_image, 'alt': $parent.alt }"/>
</picture>
<div class="content -image" data-testid="bannerRotator-banner-content" data-bind="html: $parent.html, afterRender: $parents[1].contentRendered($parent)"></div>
