<div class="toolbar toolbar-products">
    <div class="modes">
        <strong class="modes-label" id="modes-label">View as</strong>
        <strong title="Grid" class="modes-mode active mode-grid" data-value="grid">
            <span>Grid</span>
        </strong>
        <a class="modes-mode mode-list" title="List" href="#" data-role="mode-switcher" data-value="list" id="mode-list" aria-labelledby="modes-label mode-list">
            <span>List</span>
        </a>
    </div>

    <p class="toolbar-amount" id="toolbar-amount">
        Items <span class="toolbar-number">1</span>-<span class="toolbar-number">9</span> of <span class="toolbar-number">25</span>
    </p>

    <div class="pages">
        <strong class="label pages-label" id="paging-label">Page</strong>
        <ul class="items pages-items" aria-labelledby="paging-label">
            <li class="item current">
                <strong class="page">
                    <span class="label">You're currently reading page</span>
                    <span>1</span>
                </strong>
            </li>
            <li class="item">
                <a href="http://magento2-demo.nexcess.net/women/bottoms-women.html?p=2" class="page">
                    <span class="label">Page</span>
                    <span>2</span>
                </a>
            </li>
            <li class="item">
                <a href="http://magento2-demo.nexcess.net/women/bottoms-women.html?p=3" class="page">
                    <span class="label">Page</span>
                    <span>3</span>
                </a>
            </li>

            <li class="item pages-item-next">
                <a class="action  next" href="http://magento2-demo.nexcess.net/women/bottoms-women.html?p=2" title="Next">
                    <span class="label">Page</span>
                    <span>Next</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="field limiter">
        <label class="label" for="limiter">
            <span>Show</span>
        </label>
        <div class="control">
            <select id="limiter" data-role="limiter" class="limiter-options">
                <option value="9" selected="selected">9</option>
                <option value="15">15</option>
                <option value="30">30</option>
            </select>
        </div>
        <span class="limiter-text">per page</span>
    </div>

    <div class="toolbar-sorter sorter">
        <label class="sorter-label" for="sorter">Sort By</label>
        <select id="sorter" data-role="sorter" class="sorter-options">
            <option value="position" selected="selected">Position</option>Product Name</option>
            <option value="price">Price</option>
        </select>
        <a title="Set Descending Direction" href="#" class="action sorter-action sort-asc" data-role="direction-switcher" data-value="desc">
            <span>Set Descending Direction</span>
        </a>
    </div>
</div>
