<if args="isAllowed()">
    <a if="imageExists($row())"
       class="product-item-photo"
       attr="href: $row().url">
        <span data-bind="style: {width: getWidth($row()) + 'px'}, css: alternativeImageExists($row()) ? 'product-image-container multiview-container' : 'product-image-container multiview-container -no-multiview'">
            <span class="product-image-wrapper"
                  data-bind="style: {'padding-bottom': getHeight($row())/getWidth($row()) * 100 + '%'}">
                <img class="product-image-photo"
                     data-bind="attr: {src: getImageUrl($row()),
                                       alt: getLabel($row()), title: getLabel($row())}" />

                <if args="alternativeImageExists($row())">
                    <img class="image"
                         data-bind="attr: {src: getAlternativeImageUrl($row()),
                           alt: getLabel($row()), title: getLabel($row())}" />
                </if>
            </span>
        </span>
    </a>
</if>
