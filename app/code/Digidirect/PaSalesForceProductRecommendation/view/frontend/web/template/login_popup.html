<div id="modal-content">
    <input type="text" id="retrievepa_id" >
</div>

<script>
    var magento_pa_id = document.getElementById("retrievepa_id").value;
    alert("magento_pa_id: " + document.getElementById("retrievepa_id").value);
    
    var param = '{pa_id=' + document.getElementById("retrievepa_id").value + '}';
    var YOUR_URL_HERE = 'getpaidsalesforce';

    jQuery.ajax({
        url: YOUR_URL_HERE,
        type: "POST",
        data: {pa_id: param},
        dataType: "json",
        success: function() {
            alert("Thank you for subscribing!");
        },
        error: function() {
            alert("There was an error. Try again please!");
        }
    });
    
</script>
