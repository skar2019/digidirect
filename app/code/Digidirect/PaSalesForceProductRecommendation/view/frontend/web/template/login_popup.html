<div id="modal-content">
    <input type="text" id="retrievepa_id" >
</div>

<script>
    const loadconfigdata = localStorage.getItem("configData-60007039-e927-ec11-aaf7-061f6a8be99c");

    const myObj = JSON.parse(loadconfigdata);

    document.getElementById("retrievepa_id").value = myObj;

    var magento_pa_id = document.getElementById("retrievepa_id").value;

    localStorage.setItem("Magento_PA_Id", magento_pa_id); 
    
    alert("magento_pa_id: " + JSON.stringify(document.getElementById("retrievepa_id").value));
    
    var param = '{pa_id=' + document.getElementById("retrievepa_id").value + '}';
    var YOUR_URL_HERE = 'getpaidsalesforce';

    jQuery.ajax({
        url: YOUR_URL_HERE,
        type: "POST",
        data: {pa_id: param},
        dataType: "json",
        success: function() {
            alert("Thank you for subscribing!");
        },
        error: function() {
            alert("There was an error. Try again please!");
        }
    });
    
</script>
