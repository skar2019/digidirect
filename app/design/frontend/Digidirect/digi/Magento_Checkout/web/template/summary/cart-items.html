<div class="items-in-cart active" data-bind="mageInit: {'collapsible':{'openedState': 'active', 'active': true}}">
    <div class="title" data-role="title">
        <strong role="heading">
            <translate args="maxCartItemsToDisplay" if="maxCartItemsToDisplay < getCartLineItemsCount()"></translate>
            <translate args="'of'" if="maxCartItemsToDisplay < getCartLineItemsCount()"></translate>
            <span data-bind="text: getCartLineItemsCount()"></span>
            <translate args="'Item'" if="getCartLineItemsCount() === 1"></translate>
            <translate args="'Item(s)'" if="getCartLineItemsCount() > 1"></translate>
        </strong>
    </div>
    <div class="content minicart-items" data-role="content">
        <div class="minicart-items-wrapper overflowed">
            <ol data-bind="foreach: getSellers()">
                <span data-bind="text: $data"></span>
            </ol>
            <ol class="minicart-items">
                <!-- ko foreach: { data: getSellers(), as: 'seller' } -->
                    <!-- ko text: seller --><!-- /ko -->
                <!-- /ko -->
                <!-- ko foreach: { data: items(), as: 'item' } -->
                    <li class="product-item">
                        <div class="product">
                            <each args="$parent.elems()" render=""></each>
                        </div>
                        <!-- ko text: item.entity_id --><!-- /ko -->
                        <!-- ko text: item.item_id --><!-- /ko -->
                        <!-- ko text: item.name --><!-- /ko -->
                        <!-- ko text: item.marketplacer_seller --><!-- /ko -->
                    </li>
                <!-- /ko -->
            </ol>
        </div>
    </div>
    <div class="actions-toolbar" if="maxCartItemsToDisplay < getCartLineItemsCount()">
        <div class="secondary">
            <a class="action viewcart" data-bind="attr: {href: cartUrl}">
                <span data-bind="i18n: 'View and Edit Cart'"></span>
            </a>
        </div>
    </div>
</div>
