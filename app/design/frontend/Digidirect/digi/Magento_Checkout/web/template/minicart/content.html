<div class="block-title minicart-item-header">
    <i class="fas fa-shopping-bag" style="font-size: 30px;color: #ff3c00;"></i>
    <span class="text" translate="'Cart Items'"/>
    <span class="qty empty"
          text="getFormattedSummaryCount()"
          data-bind="css: {
                empty: !getCartParam('summary_count') == false },
                attr: { title: $t('Items in Cart')}"
    />
</div>

<div class="block-content">
    <button type="button"
            id="btn-minicart-close"
            class="action close"
            data-action="close"
            data-bind="
            attr: {
             title: $t('Close')
             },
            click: closeMinicart()
    ">
        <span translate="'Close'"/>
    </button>

    <if args="getCartParam('summary_count')">
        <!-- data-action="scroll" -->
        <div  class="minicart-items-wrapper" data-bind="vertScrollbarMiniCart: this">
            <ol id="mini-cart" class="minicart-items" data-bind="foreach: { data: getCartItems(), as: 'item' }">
                <each args="$parent.getRegion($parent.getItemRenderer(item.product_type))"
                      render="{name: getTemplate(), data: item, afterRender: function() {$parents[1].initSidebar()}}"
                />
            </ol>
        </div>
    </if>

    <if args="getCartParam('summary_count')">
        <each args="getRegion('subtotalContainer')" render=""/>
        <each args="getRegion('extraInfo')" render=""/>

        <div id="minicart-actions-main" class="actions" if="getCartParam('possible_onepage_checkout')">
            <div class="primary">
                <button
                        id="top-cart-btn-checkout"
                        type="button"
                        class="action secondary checkout _full-width"
                        data-action="close"
                        data-bind="
                            attr: {
                                title: $t('CHECKOUT NOW')
                            },
                            click: closeMinicart()
                        "
                        translate="'CHECKOUT NOW'"
                />
                <div data-bind="html: getCartParam('extra_actions')"></div>
            </div>
        </div>

        <div id="minicart-bottom-section" class="actions secondary">

            <div class="klarna-widget">
                <a href="/checkout">
                    <span>Buy now, Pay Later with</span>
                </a>
            </div>

            <div class="secondary">
                <button id="minicart-continue-shopping-btn" class="action secondary _full-width" data-bind="click: closeMinicart()">
                    <span translate="'Continue Shopping'"/>
                </button>
            </div>
        </div>
    </if>

    <ifnot args="getCartParam('summary_count')">
        <p class="minicart empty text"
                translate="'Your cart is empty.'"
        />
        <div class="actions secondary">
            <div class="secondary">
                <button class="action secondary _full-width" data-bind="click: closeMinicart()">
                    <span translate="'Continue Shopping'"/>
                </button>
            </div>
        </div>
        <if args="getCartParam('cart_empty_message')">
            <p class="minicart empty text" text="getCartParam('cart_empty_message')"/>
            <div class="actions">
                <div class="secondary">
                    <a class="action viewcart" data-bind="attr: {href: shoppingCartUrl}">
                        <span translate="'View and Edit Cart'"/>
                    </a>
                </div>
            </div>
        </if>
    </ifnot>

    <div id="minicart-view-cart" class="actions" if="getCartParam('summary_count')">
        <div class="secondary">
            <a class="action viewcart" data-bind="attr: {href: shoppingCartUrl}">
                <span translate="'View and Edit Cart'"/>
            </a>
        </div>
    </div>

    <div id="minicart-widgets" class="minicart-widgets">
        <each args="getRegion('promotion')" render=""/>
    </div>
</div>
<each args="getRegion('sign-in-popup')" render=""/>
