<div id="opc-sidebar"
     data-bind="afterRender:setModalElement, mageInit: {
    'Magento_Ui/js/modal/modal':{
        'type': 'custom',
        'modalClass': 'opc-sidebar opc-summary-wrapper',
        'wrapperClass': 'checkout-container',
        'parentModalClass': '_has-modal-custom',
        'responsive': true,
        'responsiveClass': 'custom-slide',
        'overlayClass': 'modal-custom-overlay',
        'buttons': []
    }}">

    <!-- ko foreach: getRegion('summary') -->
    <!-- ko template: getTemplate() --><!-- /ko -->
    <!--/ko-->
    
    <div class="opc-block-shipping-information">
        <!-- ko foreach: getRegion('shipping-information') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
    </div>
    
    <div class="secure-pay">
        <div class="title">Secure ways to pay</div>
        <div class="image-wrapper">
            <img class="" data-bind="attr: { src: require.toUrl('images/visa.svg') }" />
            <img class="" data-bind="attr: { src: require.toUrl('images/mastercard.svg') }" />
            <img class="" data-bind="attr: { src: require.toUrl('images/amex.svg') }" />
            <img class="" data-bind="attr: { src: require.toUrl('images/paypal.svg') }" />
            <img class="" data-bind="attr: { src: require.toUrl('images/zip.svg') }" />
        </div>
    </div>
</div>
